<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Criativo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f4f6fa;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .post {
      max-width: 700px;
      width: 100%;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 20px 40px -12px rgba(0, 20, 30, 0.15);
      overflow: hidden;
      transition: transform 0.2s;
    }

    .post:hover {
      transform: translateY(-4px);
    }

    .post-image {
      height: 200px;
      background: linear-gradient(145deg, #6c5ce7, #a29bfe);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .badge {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(4px);
      padding: 6px 16px;
      border-radius: 40px;
      color: white;
      font-weight: 600;
      font-size: 0.8rem;
      letter-spacing: 0.3px;
    }

    .post-content {
      padding: 24px 28px 16px 28px;
    }

    .tag {
      display: inline-block;
      background: #e8f0fe;
      color: #1a5cff;
      font-weight: 600;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 12px;
      border-radius: 40px;
      margin-bottom: 12px;
    }

    .post-content h2 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #0b1b33;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
      font-size: 0.85rem;
      color: #5b6f87;
    }

    .meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .post-actions {
      padding: 12px 28px 8px 28px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #eef2f7;
    }

    .buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .buttons button {
      background: transparent;
      border: none;
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #2c3e50;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .buttons button:hover {
      background: #f0f4fc;
    }

    .buttons .like {
      background: #fee9e9;
      color: #c0392b;
    }

    .buttons .like:hover {
      background: #fdd0d0;
    }

    .share {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #5b6f87;
    }

    .social-icons {
      display: flex;
      gap: 6px;
    }

    .social-icons a {
      text-decoration: none;
      font-size: 1.1rem;
      transition: transform 0.1s;
    }

    .social-icons a:hover {
      transform: scale(1.15);
    }

    .post-footer {
      padding: 8px 28px 24px 28px;
      background: #fafbfc;
      border-top: 1px solid #eef2f7;
    }

    .post-footer p {
      color: #2d4059;
      line-height: 1.6;
      margin-bottom: 12px;
    }

    .read-more {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      color: #1a5cff;
      text-decoration: none;
      transition: gap 0.2s;
    }

    .read-more:hover {
      gap: 12px;
    }
  </style>
</head>
<body>
  <article class="post">
    <div class="post-image">
      <span class="badge">✨ Destaque</span>
    </div>
    <div class="post-content">
      <span class="tag">Desafio</span>
      <h2>Estrutura criativa para posts</h2>
      <div class="meta">
        <span>📅 25/08/2026</span>
        <span>👤 por @devcriativo</span>
        <span>⏱ 3 min de leitura</span>
      </div>
    </div>
    <div class="post-actions">
      <div class="buttons">
        <button class="like">❤️ Curtir</button>
        <button>💬 Comentar</button>
        <button>🔖 Salvar</button>
      </div>
      <div class="share">
        <span>Compartilhe</span>
        <div class="social-icons">
          <a href="#">📘</a>
          <a href="#">🐦</a>
          <a href="#">📌</a>
        </div>
      </div>
    </div>
    <div class="post-footer">
      <p>Neste desafio, reorganizamos completamente a estrutura do post usando CSS Grid...</p>
      <a href="#" class="read-more">Continue lendo →</a>
    </div>
  </article>
</body>
</html>
