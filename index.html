<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Criativo - Projeto Alura</title>
    <style>
        /* Reset e Fonte */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1a1a;
            padding: 20px;
        }
        
        /* EFEITO HOVER NOS POSTS */
        article {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        article:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <!-- Seu conteúdo do post vai aqui -->
    <article>
        <h1>Meu Post Criativo</h1>
        <p>Conteúdo do post...</p>
    </article>
</body>
</html>
